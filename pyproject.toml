[project]
name = "django-oscar-freeletter"
version = "0.1.1"
description = "Wires django-freeletter into django-oscar: product and blog-post issue blocks, plus an Oscar dashboard section."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Diego Cebrian", email = "diego@cebrian-it.fr" }]
keywords = ["django", "django-oscar", "newsletter", "ecommerce"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: BSD License",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "django>=5.2,<5.3",
    "django-oscar>=4.2,<4.3",
    "django-freeletter>=0.1.0,<1.0",
]

[project.optional-dependencies]
# The "blog_post" block type is only registered when django-oscar-blog is
# actually installed (checked at runtime via apps.is_installed) — this
# extra just documents/pulls the dependency, it isn't required to import
# this package at all.
blog = ["django-oscar-blog>=0.1.0,<1.0"]

[project.urls]
Homepage = "https://github.com/hisie/django-oscar-freeletter"
Repository = "https://github.com/hisie/django-oscar-freeletter"
Issues = "https://github.com/hisie/django-oscar-freeletter/issues"

[dependency-groups]
dev = [
    "black",
    "coverage",
    "isort",
    "mypy",
    "pytest",
    "pytest-django",
    # Not a runtime dependency of this package (the "blog_post" block type
    # is registered conditionally, see apps.py) — only needed here so the
    # test suite can actually exercise that code path.
    "django-oscar-blog",
    "django-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oscar_freeletter"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]
mypy_path = "src"

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src/oscar_freeletter"]
